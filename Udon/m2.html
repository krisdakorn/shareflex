<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
    <link href="https://image.makewebeasy.net/makeweb/0/pMrtkmxgt/APNG_images/bot_04.png?v=202012190947"
        rel="shortcut icon" />
    <title>เลือกรายการโดยคลิกที่ปุ่ม</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(180deg, #021128 0%, #041a3d 50%, #061f4f 100%);
            color: #eef4ff;
        }

        .hero img {
            width: 100%;
            height: auto;
            max-width: 100%;
            border-radius: 18px;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
        }

        .btn-list a,
        .btn-list .btn-toggle,
        .btn-list button {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-align: left;
        }

        .btn-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .btn-toggle .arrow {
            transition: transform 0.3s ease;
            font-size: 0.8em;
        }

        .btn-toggle[aria-expanded="true"] .arrow {
            transform: rotate(180deg);
        }

        .sub-menu {
            padding-left: 1.2rem;
        }

        .sub-menu .btn {
            font-size: 0.92em;
            opacity: 0.93;
        }

        .btn-list a:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(4, 28, 71, 0.35);
        }

        .btn-secondary {
            background-color: #15416f;
            border-color: #15416f;
            color: #eef4ff;
        }

        .btn-secondary:hover,
        .btn-secondary:focus {
            background-color: #1d5a8e;
            border-color: #1d5a8e;
            color: #fff;
        }

        .btn-primary {
            background-color: #0d2b5e;
            border-color: #0d2b5e;
            color: #eef4ff;
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background-color: #16417f;
            border-color: #16417f;
            color: #fff;
        }

        .btn-info {
            background-color: #23579f;
            border-color: #23579f;
            color: #eef4ff;
        }

        .btn-info:hover,
        .btn-info:focus {
            background-color: #2f6eb9;
            border-color: #2f6eb9;
            color: #fff;
        }
    </style>
</head>

<body>
    <main class="container py-4">
        <section class="text-center mb-4 hero">
            <img src="https://image.makewebcdn.com/makeweb/0/pMrtkmxgt/APNG_images/b2.png?v=202405291424" alt="Banner"
                class="img-fluid" />
        </section>
        <!-- <section class="text-center mb-4">
            <p class="h5 fw-bold text-white">เลือกรายการ ที่ต้องการ ▼</p>
        </section> -->
        <section class="d-grid gap-2 col-11 mx-auto btn-list">

            <a href="https://liff.line.me/1657007036-ZEXSRlB9" class="btn btn-secondary"> ▪︎
                ปรึกษาผู้เชี่ยวชาญ Darin</a>

            <a href="https://liff.line.me/1657007036-djS2ogyx" class="btn btn-info"> ▪︎
                สมัครรับข่าวสาร</a>
            <!-- <button onclick="openAndClose('https://www.w3schools.com/')" class="btn btn-secondary"> ▪︎ ทดสอบปุ่มที่
                1</button>
            <button onclick="openAndClose('https://liff.line.me/1657007036-ZEXSRlB9')" class="btn btn-info"> ▪︎
                แบบฟอร์มที่ 2</button> -->

        </section>
    </main>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bubbly-bg@1.0.0/dist/bubbly-bg.js"></script>
    <script>
        const LIFF_ID = "2011195913-c5eTXIhT";
        const menuActions = {
            a01: "ตลอดชีพ 90",
            a17: "VJมาจอยกัน"
        };

        function getReferFromUrl(url = window.location.href) {
            const match = url.match(/[?&]refer=([^&#]*)/);
            return match ? decodeURIComponent(match[1].replace(/\+/g, " ")) : null;
        }

        function initLiff() {
            return liff.init({ liffId: LIFF_ID }).catch((error) => {
                console.error("LIFF init failed", error);
                throw error;
            });
        }

        function sendLiffMessage(text) {
            return liff.sendMessages([{ type: "text", text }]).then(() => liff.closeWindow());
        }

        async function openAndClose(url) {
            try {
                await initLiff();
                if (liff.isInClient()) {
                    // อยู่ใน LINE app: เปิดเบราว์เซอร์ภายนอก แล้วรอ 1 วินาทีก่อนปิด LIFF
                    liff.openWindow({
                        url: url,
                        external: true
                    });
                    setTimeout(() => {
                        liff.closeWindow();
                    }, 1000);
                } else {
                    // อยู่บน PC browser: เปิดแท็บใหม่
                    window.open(url, '_blank');
                }
            } catch (error) {
                // ถ้า LIFF init ไม่สำเร็จ ให้เปิดลิงก์แบบปกติ
                console.error("openAndClose error:", error);
                window.open(url, '_blank');
            }
        }

        async function handleRefer(refer) {
            const message = menuActions[refer];
            if (!message) return;

            if (!window.liff) {
                console.error("LIFF SDK not loaded");
                return;
            }

            try {
                await initLiff();
                if (!liff.isLoggedIn()) {
                    return liff.login();
                }
                await sendLiffMessage(message);
            } catch (error) {
                console.error("Message send failed", error);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const root = document.querySelector(".btn-list");
            if (root) {
                root.addEventListener("click", (event) => {
                    const anchor = event.target.closest("a[href*='?refer=']");
                    if (!anchor) return;
                    event.preventDefault();
                    const url = new URL(anchor.href, window.location.href);
                    const refer = getReferFromUrl(url.href);
                    handleRefer(refer);
                });
            }

            const refer = getReferFromUrl();
            if (refer) {
                handleRefer(refer);
            }
        });

        bubbly({
            colorStart: "#07172e",
            colorStop: "#0b2e5e"
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
